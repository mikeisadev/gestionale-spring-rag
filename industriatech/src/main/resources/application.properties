spring.application.name=industriatech

# ===== DATABASE (MariaDB in Docker: container industriatech-mariadb) =====
# Valori per lo sviluppo da VS Code: MariaDB del container, esposto su localhost:3307.
# Dentro Docker il backend li sovrascrive con variabili d'ambiente
# (es. SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/industriatech): vedi docker/docker-compose.yml
spring.datasource.url=jdbc:mariadb://localhost:3307/industriatech
spring.datasource.username=industriatech
spring.datasource.password=industriatech123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== SERVER =====
server.port=8081

# ===== LOGGING =====
logging.level.org.hibernate.SQL=DEBUG

# ===== AI ======
# spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
# spring.ai.google.genai.chat.model=gemini-3.8-flash

# spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
# spring.ai.anthropic.chat.model=claude-sonnet-4-5

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4.1-mini

# SELEZIONE PROVIDER
# Chat -> OpenAI, Embedding -> Ollama (locale)
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

# OLLAMA EMBEDDINGS (bge-m3, 1024 dimensioni)
# In Docker: SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=bge-m3
# Il modello viene scaricato dal container ollama-init: non scaricarlo da Spring
spring.ai.ollama.init.pull-model-strategy=never

# POSTGRESQL SECONDARIO
# In Docker: APP_DATASOURCE_PGVECTOR_URL=jdbc:postgresql://postgres:5432/chatbot
app.datasource.pgvector.url=jdbc:postgresql://localhost:5433/chatbot
app.datasource.pgvector.username=chatbot
app.datasource.pgvector.password=chatbot123
app.datasource.pgvector.driver-class-name=org.postgresql.Driver

# PGVECTOR
spring.ai.vectorstore.pgvector.initialize-schema=true
# Deve corrispondere alla dimensione dei vettori di bge-m3
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# DOCUMENTI
# In Docker: APP_DOCUMENTS_DIRECTORY=/app/documents/pdf
app.documents.directory=documents/pdf
# Chunk inviati a ogni vectorStore.add(...): blocchi piccoli = avanzamento più frequente
app.documents.indexing-batch-size=2

# UPLOAD PDF (in Spring MVC il limite predefinito è solo 1MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# STREAMING SSE DELLA CHAT (le risposte lunghe dell'LLM possono superare il timeout predefinito di Tomcat)
spring.mvc.async.request-timeout=120s
