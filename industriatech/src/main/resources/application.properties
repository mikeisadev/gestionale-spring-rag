spring.application.name=industriatech

# ===== DATABASE (MariaDB in Docker: container industriatech-mariadb) =====
# Valori per lo sviluppo da VS Code: MariaDB del container, esposto su localhost:3307.
# Dentro Docker il backend li sovrascrive con variabili d'ambiente
# (es. SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/industriatech): vedi docker/docker-compose.yml
spring.datasource.url=jdbc:mariadb://localhost:3307/industriatech
spring.datasource.username=industriatech
spring.datasource.password=industriatech123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== SERVER =====
server.port=8081

# ===== LOGGING =====
logging.level.org.hibernate.SQL=DEBUG

# ===== AI ======
# spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
# spring.ai.google.genai.chat.model=gemini-3.8-flash

# spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
# spring.ai.anthropic.chat.model=claude-sonnet-4-5

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4.1-mini
# Lezione 8 (guardrail, consumo): risposta lunga al massimo 800 token
spring.ai.openai.chat.max-tokens=800

# SELEZIONE PROVIDER
# Chat -> OpenAI, Embedding -> Ollama (locale)
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

# OLLAMA EMBEDDINGS (bge-m3, 1024 dimensioni)
# In Docker: SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=bge-m3
# Il modello viene scaricato dal container ollama-init: non scaricarlo da Spring
spring.ai.ollama.init.pull-model-strategy=never

# POSTGRESQL SECONDARIO
# In Docker: APP_DATASOURCE_PGVECTOR_URL=jdbc:postgresql://postgres:5432/chatbot
app.datasource.pgvector.url=jdbc:postgresql://localhost:5433/chatbot
app.datasource.pgvector.username=chatbot
app.datasource.pgvector.password=chatbot123
app.datasource.pgvector.driver-class-name=org.postgresql.Driver

# PGVECTOR
spring.ai.vectorstore.pgvector.initialize-schema=true
# Deve corrispondere alla dimensione dei vettori di bge-m3
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# DOCUMENTI
# In Docker: APP_DOCUMENTS_DIRECTORY=/app/documents/pdf
# Lezione 10: la cartella si chiama ancora "pdf" ma contiene tutti i formati accettati
app.documents.directory=documents/pdf
# Chunk inviati a ogni vectorStore.add(...): blocchi piccoli = avanzamento più frequente
app.documents.indexing-batch-size=2

# UPLOAD PDF (in Spring MVC il limite predefinito è solo 1MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===== STRUMENTI DELL'AGENTE (lezione 6) =====
# Limiti per ogni domanda: massimo 5 chiamate allo stesso strumento e 10 in totale
spring.ai.tools.limits.max-calls-per-tool-default=5
spring.ai.tools.limits.max-total-tool-calls=10
# Invece di interrompere la risposta, comunica al modello che il limite è stato raggiunto
spring.ai.tools.limits.on-limit-exceeded=RETURN_ERROR_RESPONSE

# LLM WIKI (lezione 11)
# Cartella del vault di Obsidian (le pagine sono nella sottocartella "wiki").
# Come per le chiavi API, il percorso arriva da una variabile d'ambiente: WIKI_VAULT_PATH.
# Se è vuota la wiki è DISATTIVATA e il gestionale funziona come prima.
#   VS Code: file .env nella cartella del progetto (vedi .env.example)
#   Docker:  WIKI_VAULT_PATH in docker/.env
app.wiki.vault-path=${WIKI_VAULT_PATH:}
app.wiki.wiki-folder=wiki
app.wiki.max-page-bytes=200000

# UTENTE: dalla lezione 13 arriva dal login (Spring Security). L'utente demo non esiste più:
# ruolo e reparto si assegnano dalla pagina "Utenti" (solo amministratori).

# EMAIL: l'agente prepara le bozze, l'utente conferma l'invio
# Mailpit (server email finto per i test): SMTP su 1025, pagina web su http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
app.email.allowed-domain=azienda.it
app.email.from=assistente@azienda.it

# n8n (la tua istanza): webhook per aprire i ticket
# In Docker: APP_N8N_BASE_URL=http://host.docker.internal:5678
app.n8n.base-url=http://localhost:5678
app.n8n.api-key=${N8N_API_KEY:}
app.n8n.ticket-webhook-path=/webhook/apri-ticket

# n8n come SERVER MCP (nodo "MCP Server Trigger"): togli il commento quando il workflow è attivo.
# ATTENZIONE: con la connessione attiva e n8n spento, il backend non si avvia.
# spring.ai.mcp.client.streamable-http.connections.n8n.url=http://localhost:5678
# spring.ai.mcp.client.streamable-http.connections.n8n.endpoint=/mcp/<percorso-mostrato-da-n8n>
app.n8n.mcp-token=${N8N_MCP_TOKEN:}
# Strumenti MCP ammessi (gli altri vengono scartati da McpClientConfig)
app.mcp.allowed-tools=crea_ticket,stato_ordine

# ===== GUARDRAIL (lezione 8) =====
# Massimo messaggi al minuto per utente (Bucket4j): oltre -> 429 Too Many Requests
app.guardrails.rate-limit.messages-per-minute=10
# SafeGuardAdvisor di Spring AI: spento, perché controlla anche documenti e storico (vedi lezione 8)
app.guardrails.safeguard.enabled=false
app.guardrails.safeguard.sensitive-words=password,credenziali di accesso

# ===== OSSERVABILITÀ (lezione 9) =====
# Metriche: http://localhost:8081/actuator/metrics/gen_ai.client.token.usage
# ATTENZIONE: finché non c'è Spring Security (prompt 13) l'endpoint è pubblico: in produzione va protetto
management.endpoints.web.exposure.include=health,metrics
# Tracce: in sviluppo registriamo il 100% delle richieste (predefinito: 10%) e le inviamo a Zipkin
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
# Con Reactor (Flux/Mono): tiene nella stessa traccia anche i passaggi eseguiti su altri thread
spring.reactor.context-propagation=auto
# Log completi delle richieste al modello (SimpleLoggerAdvisor): SOLO IN SVILUPPO,
# contengono i messaggi degli utenti e il testo dei documenti
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# STREAMING SSE DELLA CHAT (le risposte lunghe dell'LLM possono superare il timeout predefinito di Tomcat)
spring.mvc.async.request-timeout=120s

# SICUREZZA (lezione 13)
# Origini del browser autorizzate a chiamare le API con i cookie (separate da virgola).
# In Docker frontend e API hanno la stessa origine (nginx): CORS non serve.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Cookie di sessione: mai leggibile da JavaScript; SameSite=Lax; Secure solo con HTTPS (in produzione: true)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=60m
# Primo amministratore: SOLO da variabili d'ambiente, mai scritto qui (vedi AdminBootstrap)
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
# Tentativi di login al minuto per la stessa email
app.security.login-attempts-per-minute=5
# /actuator/health è pubblico: solo UP/DOWN, senza dettagli sui servizi interni
management.endpoint.health.show-details=never

