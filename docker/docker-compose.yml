# ============================================================
# Gestionale + sistema RAG: infrastruttura completa in Docker
#
# Avvio:   cd docker && docker compose up -d --build
# Stop:    docker compose down          (i dati restano nei volumi)
#
# Servizio        Container               Porta sul tuo computer
# ----------------------------------------------------------------
# frontend        industriatech-frontend     http://localhost:3000
# backend         industriatech-backend      http://localhost:8090
# mariadb         industriatech-mariadb      localhost:3307
# phpmyadmin      industriatech-phpmyadmin   http://localhost:8082
# postgres        chatbot-postgres        localhost:5433
# pgadmin         chatbot-pgadmin         http://localhost:5050
# ollama          chatbot-ollama          http://localhost:11434
# mailpit         industriatech-mailpit   http://localhost:8025 (email di test)
# zipkin          industriatech-zipkin    http://localhost:9411 (tracce delle richieste)
#
# Le porte di frontend (3000) e backend (8090) sono diverse da quelle dello
# sviluppo (5173 e 8081): puoi usare Docker e VS Code contemporaneamente.
#
# Credenziali e chiave OpenAI: file docker/.env (copia di .env.example).
# ============================================================

services:

  # ===== DATABASE PRINCIPALE (gestionale) =====
  mariadb:
    image: mariadb:lts
    container_name: industriatech-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root123}
      MARIADB_DATABASE: industriatech
      MARIADB_USER: ${MARIADB_USER:-industriatech}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-industriatech123}

    ports:
      # 3307 sul computer: la 3306 è spesso occupata da un MariaDB/MySQL locale
      - "3307:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      # Script incluso nell'immagine ufficiale: verifica che il server accetti connessioni
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: industriatech-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mariadb          # nome del servizio MariaDB nella rete di Docker
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M         # import di file .sql grandi

    ports:
      - "8082:80"

    depends_on:
      mariadb:
        condition: service_healthy

  # ===== DATABASE VETTORIALE (RAG) =====
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chatbot-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chatbot-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    volumes:
      # Registra automaticamente il server "Chatbot PostgreSQL" (password: chatbot123)
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

    depends_on:
      postgres:
        condition: service_healthy

  # ===== OLLAMA (modelli locali) =====
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-ollama

    restart: unless-stopped

    environment:
      OLLAMA_KEEP_ALIVE: 24h

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Scarica il modello di embedding bge-m3 al primo avvio (poi termina).
  # I modelli restano salvati nel volume ollama_data.
  ollama-init:
    image: ollama/ollama:latest
    container_name: chatbot-ollama-init

    environment:
      OLLAMA_HOST: http://ollama:11434

    entrypoint: ["ollama", "pull", "bge-m3"]

    restart: "no"

    depends_on:
      ollama:
        condition: service_healthy

  # ===== EMAIL DI TEST (lezione 6) =====
  # Mailpit è un server email "finto": riceve le email inviate dal backend
  # e le mostra in una pagina web, senza spedirle davvero a nessuno.
  mailpit:
    image: axllent/mailpit:latest
    container_name: industriatech-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # pagina web
      - "1025:1025"   # SMTP (usato dal backend)

  # ===== TRACCE (lezione 9) =====
  # Zipkin raccoglie le tracce: ogni richiesta scomposta nei suoi passaggi con la durata
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: industriatech-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

  # ===== BACKEND SPRING BOOT =====
  backend:
    build:
      context: ../industriatech
    image: industriatech-backend
    container_name: industriatech-backend
    restart: unless-stopped

    # Le variabili d'ambiente sovrascrivono application.properties.
    # Regola di Spring: spring.datasource.url -> SPRING_DATASOURCE_URL
    # (maiuscolo, punti e trattini diventano "_").
    # Dentro Docker i servizi si raggiungono con il NOME DEL SERVIZIO, non con localhost.
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/industriatech
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-industriatech}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:-industriatech123}
      APP_DATASOURCE_PGVECTOR_URL: jdbc:postgresql://postgres:5432/chatbot
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      APP_DOCUMENTS_DIRECTORY: /app/documents/pdf
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Lezione 9: tracce verso il container Zipkin
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Nel container NON stampiamo i prompt completi (contengono dati di utenti e documenti)
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI_CHAT_CLIENT_ADVISOR: INFO
      # Lezione 6: email di test e n8n
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      # n8n gira in un'ALTRA configurazione Docker (la tua): dal container lo raggiungiamo
      # tramite il computer host, con il nome speciale host.docker.internal
      APP_N8N_BASE_URL: http://host.docker.internal:5678
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_MCP_TOKEN: ${N8N_MCP_TOKEN:-}
      # Lezione 11: la LLM Wiki, montata in sola lettura (vedi "volumes" qui sotto)
      APP_WIKI_VAULT_PATH: /app/wiki
      # Lezione 13: primo amministratore (solo da docker/.env, mai scritto qui) e cookie di sessione.
      # Dietro HTTPS in produzione: SESSION_COOKIE_SECURE=true
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Solo per mostrare il nome del vault nella pagina (dentro il container la cartella si chiama "wiki")
      APP_WIKI_DISPLAY_PATH: ${WIKI_VAULT_PATH:-llm-wiki-esempio}
      # Fuso orario della JVM: senza, il container usa UTC e le date delle chat
      # risulterebbero un'ora indietro rispetto all'app avviata da VS Code
      TZ: Europe/Rome
      # In un container non serve stampare ogni query SQL
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO

    ports:
      - "8090:8081"

    volumes:
      # Stessa cartella dei PDF usata in sviluppo (gestionale-spring-rag/documents)
      - ../documents:/app/documents
      # Lezione 11: il vault della LLM Wiki in SOLA LETTURA (":ro").
      # Senza WIKI_VAULT_PATH in docker/.env si usa la wiki di esempio del progetto.
      # ATTENZIONE: usa lo stesso vault del backend di VS Code. I due backend condividono
      # pgvector: reindicizzando un vault diverso, l'altro vedrebbe "sparire" le sue pagine.
      - ${WIKI_VAULT_PATH:-../llm-wiki-esempio}:/app/wiki:ro

    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      zipkin:
        condition: service_started

  # ===== FRONTEND REACT (nginx) =====
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ""   # chiamate relative: /api/... -> proxy nginx -> backend
    image: industriatech-frontend
    container_name: industriatech-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
  mariadb_data:
