<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corso Spring Boot</title>

    <!-- Includo qui il CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/card.css">

    <!-- Includo qui Javascript -->
    <script src="assets/js/script.js"></script>
    <script src="assets/js/network.js"></script>
</head>

<body>
    <h1 style="text-align: center;">Gestionale</h1>

    <div class="main-box">
        <h2>Gestione dipendenti</h2>

        <form>
            <input type="text" placeholder="Inserisci il nome di un dipendente..."/>
            <input type="submit" value="Invia" />
        </form>

        <!-- Genera qui dentro la lista dei dipendenti -->
        <div class="data-box">

            <article class="employee-card" aria-labelledby="employee-mario-name">
                <div class="employee-card__banner" aria-hidden="true"></div>
                <div class="employee-card__content">
                    <div class="employee-card__top">
                        <div class="employee-card__avatar" aria-hidden="true">MR</div>
                        <span class="employee-card__status">Attivo</span>
                    </div>

                    <h3 id="employee-mario-name">Mario Rossi</h3>
                    <p class="employee-card__role">Responsabile vendite</p>

                    <div class="employee-card__details">
                        <div>
                            <span class="employee-card__detail-label">Email</span>
                            <span class="employee-card__detail-value">mario.rossi@azienda.it</span>
                        </div>
                        <div>
                            <span class="employee-card__detail-label">Reparto</span>
                            <span class="employee-card__detail-value">Commerciale</span>
                        </div>
                    </div>

                    <div class="employee-card__actions">
                        <a class="employee-card__button employee-card__button--primary" href="mailto:mario.rossi@azienda.it">Contatta</a>
                        <button class="employee-card__button" type="button" aria-label="Altre azioni per Mario Rossi">•••</button>
                    </div>
                </div>
            </article>

        </div>
    </div>
</body>

</html>
