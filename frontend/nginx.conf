# nginx dentro il container del frontend:
# - serve l'app React (file statici)
# - inoltra le chiamate /api/... al container del backend (reverse proxy)
#
# Browser -> http://localhost:3000/api/chat -> nginx -> http://backend:8081/api/chat
# Per il browser frontend e API hanno la stessa origine: niente problemi di CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload dei PDF: stesso limite del backend (spring.servlet.multipart.max-file-size)
    client_max_body_size 100m;

    location /api/ {
        # "backend" è il nome del servizio in docker-compose.yml:
        # nella rete di Docker funziona come un nome di dominio
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming SSE della chat: nginx NON deve accumulare la risposta,
        # altrimenti i token arriverebbero tutti insieme alla fine.
        proxy_buffering off;
        proxy_cache off;

        # Risposte lunghe dell'LLM e upload di file grandi
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React Router: qualsiasi percorso sconosciuto (es. /chat, /upload-rag)
    # restituisce index.html, poi è React a mostrare la pagina giusta.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
